# Dependabot — https://docs.github.com/en/code-security/dependabot/working-with-dependabot/dependabot-options-reference
# Weekly, grouped PRs keep noise low. Every PR still runs the full CI before you merge it.
# PRs target `develop` (not `main`), so each update is tried on the test site before release.
# (Security updates ignore `target-branch` and go to the default branch, `main`.)
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      astro:
        patterns: ['astro', '@astrojs/*']
      tooling:
        patterns: ['prettier*', 'typescript', 'linkinator', 'wrangler']
      fonts:
        patterns: ['@fontsource/*']
    commit-message:
      prefix: 'chore(deps)'

  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: 'chore(ci)'
