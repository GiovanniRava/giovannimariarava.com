# PRODUCTION pipeline — giovannimariarava.com, branch `main`.
# Steps live in pipeline.yml; this file only says what to build and where to deploy it.
# See docs/environments.md (environments, release switch) and docs/deployment.md (one-time setup).
#
#  pull request into main : verify only (no secrets, no deploy).
#  push to main           : verify, then deploy to the `production` Environment — and ONLY when the
#                           repository variable DEPLOY_ENABLED == 'true' (safety switch, so nothing
#                           is published before Cloudflare is configured).

name: CI/CD (production)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Cancel superseded runs on the same branch/PR, but never cancel a deploy half-way.
concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  pipeline:
    name: Production
    uses: ./.github/workflows/pipeline.yml
    secrets: inherit
    with:
      # >>> RELEASE SWITCH <<<
      # 'launch' = minimal landing page only. Change to 'full' to publish the whole site
      # (after it has been checked on the test environment). Nothing else needs to change.
      site_mode: launch
      site_url: https://giovannimariarava.com
      site_env: production
      environment: production
      wrangler_config: wrangler.jsonc
      deploy: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true' }}
