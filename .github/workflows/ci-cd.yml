# CI/CD for giovannimariarava.com — see docs/deployment.md for the one-time setup.
#
#  verify  : runs on every push and pull request. Has NO access to secrets.
#            format check -> astro check -> security.txt check -> build -> internal link check.
#  deploy  : runs ONLY on pushes to `main`, after `verify` succeeded, and ONLY when the repository
#            variable DEPLOY_ENABLED == 'true' (a safety switch, so nothing is published before
#            you have configured Cloudflare). Uses the `production` Environment, which holds the
#            Cloudflare secrets.
#
# Security notes:
#  - Third-party actions are pinned to full commit SHAs (the tag is in the comment).
#    Dependabot (.github/dependabot.yml) keeps these SHAs up to date.
#  - Default token permissions are read-only; no job asks for more.
#  - `persist-credentials: false` so the git token is not left on disk for later steps.

name: CI/CD

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Cancel superseded runs on the same branch/PR, but never cancel a deploy half-way.
concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  verify:
    name: Verify (format, types, build, links)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc # single source of truth for the Node version
          cache: npm

      # `npm ci` installs exactly what package-lock.json says (fails if it is out of sync).
      - run: npm ci

      - name: Prettier (formatting)
        run: npm run format:check

      - name: Astro check (types, content schemas)
        run: npm run check

      - name: security.txt (RFC 9116 fields, not about to expire)
        run: npm run check:security-txt

      - name: Build
        run: npm run build

      - name: Broken internal links
        run: npm run links

      # External links can fail for reasons outside our control (a third-party outage), so they
      # are reported but never block a merge.
      - name: Broken external links (informational)
        continue-on-error: true
        run: npm run links:external

  deploy:
    name: Deploy to Cloudflare
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production
      url: https://giovannimariarava.com
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm run build

      # wrangler is a pinned devDependency (package.json), not a floating third-party action.
      - name: Deploy (wrangler)
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
